<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asignación de Turnos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- SECCIÓN SUPERIOR: FORMULARIO + PREVIEW -->
    <div class="top-section">
        <!-- FORMULARIO (IZQUIERDA) -->
        <div class="form-card">
            <h1>📋 Sistema de Asignación de Turnos</h1>
            <div id="alert" class="alert"></div>
            <form id="formAsignacion">
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label>📅 Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group form-group-half">
                        <label>👤 Nombre portero</label>
                        <select id="portero" required>
                            <option value="">Seleccione un portero</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label>Día de descanso</label>
                        <select id="diaDescanso" required disabled>
                            <option value="">Primero seleccione un portero</option>
                        </select>
                    </div>
                    <div class="form-group form-group-half">
                        <label>📆 Día a asignar</label>
                        <select id="diaAsignar" required disabled>
                            <option value="">Primero seleccione día de descanso</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label>🕐 Hora inicio</label>
                        <input type="time" id="horaInicio" required disabled>
                    </div>
                    <div class="form-group form-group-half">
                        <label>🕑 Hora fin</label>
                        <input type="time" id="horaFin" required disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label>🔧 Horas de mantenimiento</label>
                    <select id="horasMantenimiento">
                        <option value="false">No</option>
                        <option value="true">Sí</option>
                    </select>
                </div>

                <div class="horas-info">
                    ⏱️ Conteo de horas: <strong id="conteoHoras">0</strong> horas
                </div>

                <div id="recomendacion-box" class="info-box">
                    <label id="label-recomendacion">Recomendación de asignación</label>
                    <button type="button" onclick="usarRecomendacion()">⚡ Asignar recomendación</button>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnAsignar" disabled>✅ Asignar Turno</button>
                    <button type="button" id="btnReiniciar" class="btn-danger">🗑️ Reiniciar registros</button>
                </div>
            </form>
        </div>

        <!-- PREVIEW EXCEL (DERECHA) -->
        <div class="preview-card">
            <div class="preview-header">
                <h2><i class="fas fa-file-excel"></i> Vista Previa del Reporte</h2>
                <button id="btnDescargarExcel" class="btn-download">
                    <i class="fas fa-download"></i> Descargar Excel
                </button>
            </div>
            <div id="excelPreview" class="excel-preview">
                <div class="loading-preview">
                    <i class="fas fa-spinner fa-spin"></i> Cargando vista previa...
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN INFERIOR: GRILLAS -->
    <div class="bottom-section">
        <div class="table-card">
            <h2>📊 Turnos Asignados - <span id="fechaActual"></span></h2>
            <div class="table-responsive">
                <div id="tablaAsignaciones"></div>
            </div>
            <button id="btnContinuar" class="btn-secondary" style="display:none;">
                🔄 Continuar asignaciones de turnos
            </button>
        </div>

        <div class="table-card">
            <h2>👥 Contabilidad del personal</h2>
            <div class="table-responsive">
                <div id="tablaContabilidad"></div>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="cerrar-modal" onclick="cerrarModalEditar()">&times;</span>
            <h2>Editar turno</h2>
            <form id="formEditar">
                <input type="hidden" id="editarId">
                <div class="form-row">
                    <div class="form-group-half">
                        <label>Portero</label>
                        <select id="editarPortero"></select>
                    </div>
                    <div class="form-group-half">
                        <label>Día asignar</label>
                        <select id="editarDia"></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group-half">
                        <label>Hora inicio</label>
                        <input type="time" id="editarHoraInicio">
                    </div>
                    <div class="form-group-half">
                        <label>Hora fin</label>
                        <input type="time" id="editarHoraFin">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group-half">
                        <label>Actividad</label>
                        <select id="editarActividad">
                            <option value="Porteria">Porteria</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-guardar-modal">💾 Guardar cambios</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
